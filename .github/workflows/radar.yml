# Met à jour Radar Bourse automatiquement et le publie sur GitHub Pages.
# - toutes les heures, jour et nuit, 7 jours sur 7 (les cryptos ne ferment jamais)
# - un calcul complet chaque soir, qui sauvegarde aussi l'historique des prédictions
# Si Yahoo bloque, le site n'est pas republié : l'ancienne version reste en ligne.
name: Mise à jour du Radar

on:
  schedule:
    - cron: "5 * * * *"         # chaque heure, 7 jours sur 7
    - cron: "30 22 * * *"       # chaque soir à 22h30 UTC (après la clôture de Wall Street)
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["bourse_bot/**", "requirements.txt", ".github/workflows/**"]

# Sécurité : aucun droit par défaut, chaque tâche reçoit seulement ce dont elle a besoin
permissions: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # uniquement pour enregistrer l'historique des prédictions
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      # Alertes Telegram (facultatives) : envoyées seulement lors du calcul du soir
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      TELEGRAM_CHAINE: ${{ vars.TELEGRAM_CHAINE }}
      RADAR_ALERTES: ${{ github.event.schedule == '30 22 * * *' && '1' || '0' }}
      # Le soir (et au lancement manuel), l'IA compare ses 3 façons de prévoir ; la journée, elle réutilise le choix
      RADAR_SELECTION: ${{ (github.event.schedule == '30 22 * * *' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && '1' || '0' }}
      RADAR_CACHE_MAX_H: "0.5"
      # Facultatif : code de vérification Google Search Console (Settings → Secrets and variables → Variables)
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      # Statistiques de visites privées (facultatif)
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      # Nom de domaine personnalisé (facultatif, réglé par nom_de_domaine.bat)
      RADAR_DOMAINE: ${{ vars.RADAR_DOMAINE }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Le cache des cours sert de secours si Yahoo ne répond pas pour certains titres
      # Le cache garde aussi les IA entraînées du jour : les mises à jour horaires vont ainsi 2 à 3 fois plus vite
      - uses: actions/cache@v6
        with:
          path: |
            .cache_cours
            .cache_modeles
          key: cours-${{ github.run_id }}
          restore-keys: cours-

      - name: Analyser les marchés et générer le site
        run: |
          for essai in 1 2 3; do
            python -m bourse_bot --pas-de-navigateur site && exit 0
            echo "Essai $essai raté, nouvelle tentative dans 90 s…"; sleep 90
          done
          exit 1

      - name: Sauvegarder l'historique, le choix du modèle et le point du jour (le soir, ou après une nouvelle version)
        if: github.event.schedule == '30 22 * * *' || github.event_name != 'schedule'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # ne jamais effacer ce que l'IA a appris ailleurs (entraînement sur le PC ou entraînement automatique)
          python -m bourse_bot.savoir local
          git add historique/
          git commit -m "Prédictions du $(date +%F)" || exit 0
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

      # Le soir, envoie TOUTES les pages du plan du site aux moteurs IndexNow (Bing, DuckDuckGo, Yahoo, Yandex, Seznam…)
      # en un seul envoi (jusqu'à 10 000 adresses). Google n'utilise pas IndexNow : lui lit le sitemap.
      - name: Prévenir les moteurs de recherche
        if: github.event.schedule == '30 22 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          DEPOT: ${{ github.repository }}
          URL_SITE: ${{ steps.deploiement.outputs.page_url }}
        run: |
          sleep 60   # laisse le temps à la nouvelle version d'être en ligne
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          u = os.environ["URL_SITE"]
          u = u if u.endswith("/") else u + "/"
          cle = hashlib.sha256(("radar-" + os.environ["DEPOT"]).encode()).hexdigest()[:32]
          with urllib.request.urlopen(u + "sitemap.xml", timeout=30) as r:
              adresses = re.findall(r"<loc>([^<]+)</loc>", r.read().decode("utf-8"))[:10000]
          corps = json.dumps({"host": urllib.parse.urlparse(u).netloc, "key": cle, "keyLocation": u + cle + ".txt",
                              "urlList": adresses}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=corps, method="POST",
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow : {len(adresses)} pages envoyées (réponse {r.status})")
          except urllib.error.HTTPError as e:
              print(f"IndexNow : réponse {e.code} pour {len(adresses)} pages")
          PY
