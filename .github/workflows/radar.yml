# Met à jour Radar Bourse automatiquement et le publie sur GitHub Pages.
# - toutes les heures pendant les heures de marché (lundi → vendredi)
# - toutes les 3 heures le week-end (les cryptos ne ferment jamais)
# - un calcul complet chaque soir, qui sauvegarde aussi l'historique des prédictions
# Si Yahoo bloque, le site n'est pas republié : l'ancienne version reste en ligne.
name: Mise à jour du Radar

on:
  schedule:
    - cron: "5 7-21 * * 1-5"    # chaque heure de 7h05 à 21h05 UTC en semaine
    - cron: "5 */3 * * 0,6"     # toutes les 3 h le week-end
    - cron: "30 22 * * *"       # chaque soir à 22h30 UTC (après la clôture de Wall Street)
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["bourse_bot/**", "requirements.txt", ".github/workflows/**"]

# Sécurité : aucun droit par défaut, chaque tâche reçoit seulement ce dont elle a besoin
permissions: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # uniquement pour enregistrer l'historique des prédictions
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      # Alertes Telegram (facultatives) : envoyées seulement lors du calcul du soir
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      TELEGRAM_CHAINE: ${{ vars.TELEGRAM_CHAINE }}
      RADAR_ALERTES: ${{ github.event.schedule == '30 22 * * *' && '1' || '0' }}
      RADAR_CACHE_MAX_H: "0.5"
      # Facultatif : code de vérification Google Search Console (Settings → Secrets and variables → Variables)
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Le cache des cours sert de secours si Yahoo ne répond pas pour certains titres
      - uses: actions/cache@v4
        with:
          path: .cache_cours
          key: cours-${{ github.run_id }}
          restore-keys: cours-

      - name: Analyser les marchés et générer le site
        run: |
          for essai in 1 2 3; do
            python -m bourse_bot --pas-de-navigateur site && exit 0
            echo "Essai $essai raté, nouvelle tentative dans 90 s…"; sleep 90
          done
          exit 1

      - name: Sauvegarder l'historique des prédictions (le soir seulement)
        if: github.event.schedule == '30 22 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add historique/predictions.csv
          git commit -m "Prédictions du $(date +%F)" || exit 0
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
